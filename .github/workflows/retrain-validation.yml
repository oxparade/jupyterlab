name: retrain-validation

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Retraining trigger category
        required: false
        default: manual
      strategy:
        description: Feature strategy
        required: false
        default: mixed
      split_strategy:
        description: Temporal split strategy
        required: false
        default: full_history
      register_model:
        description: Register model in MLflow Registry
        required: false
        default: "false"
      promote_model:
        description: Promote challenger to champion
        required: false
        default: "false"
  schedule:
    - cron: "0 5 * * 1"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import urllib.request
          import zipfile

          url = "https://archive.ics.uci.edu/static/public/321/electricityloaddiagrams20112014.zip"
          output = Path("data/LD2011_2014.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(url) as response, zipfile.ZipFile(io.BytesIO(response.read())) as archive:
              names = [name for name in archive.namelist() if name.endswith(".txt")]
              if not names:
                  raise SystemExit("No .txt file found in dataset archive")
              output.write_bytes(archive.read(names[0]))
          print(f"wrote {output}")
          PY

      - name: Run retrain and validation pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python retrain_validate.py \
            --trigger-source "${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.trigger_source || 'manual' }}" \
            --strategy "${{ github.event.inputs.strategy || 'mixed' }}" \
            --split-strategy "${{ github.event.inputs.split_strategy || 'full_history' }}" \
            --register-model "${{ github.event.inputs.register_model || 'false' }}" \
            --promote-model "${{ github.event.inputs.promote_model || 'false' }}"
