stages:
  prepare_modelling_data:
    cmd: .venv/bin/python data/code/cli.py
    deps:
      - data/code/cli.py
      - data/code/constants.py
      - data/code/loading.py
      - data/code/paths.py
      - data/code/processing.py
      - data/LD2011_2014.txt
      - data/raw/raw.txt
      - data/processed/filtered_individuals.csv
    outs:
      - data/modelling/features.parquet
      - data/modelling/target.parquet

  materialize_temporal_splits:
    cmd: .venv/bin/python data/code/materialize_splits.py
    deps:
      - data/code/materialize_splits.py
      - data/code/ml_pipeline.py
      - data/modelling/features.parquet
      - data/modelling/target.parquet
    outs:
      - data/splits/split_v1_2011-2012_2013_2014
      - data/splits/split_v2_2013_2014H1_2014H2

  prep_mlflow_data:
    cmd: python prep.py --input data/LD2011_2014.txt --strategy ${prep_mlflow_data.strategy} --split-strategy ${prep_mlflow_data.split_strategy}
    params:
      - prep_mlflow_data.strategy
      - prep_mlflow_data.split_strategy
    deps:
      - prep.py
      - config.py
      - pipeline_steps.py
      - data/LD2011_2014.txt
    outs:
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/test.parquet
