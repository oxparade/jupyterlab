# PIPELINE DEFINITION
# Name: electricity-forecaster-kubeflow
# Description: Kubeflow-native orchestration for the current MLflow/DVC project.
# Inputs:
#    evidently_api_url: str [Default: '']
#    evidently_project_name: str [Default: 'electricity_forecaster']
#    evidently_secret: str [Default: '']
#    first_strategy: str [Default: 'short_memory']
#    governance_dry_run: str [Default: 'false']
#    min_gain: float [Default: 0.02]
#    mlflow_tracking_uri: str [Default: '']
#    model_name: str [Default: 'electricity_forecaster']
#    raw_dataset_uri: str [Default: 's3://models/datasets/LD2011_2014_kwh.parquet']
#    second_strategy: str [Default: 'mixed']
#    source_dir: str [Default: '/workspace/jupyterlab']
#    split_strategy: str [Default: 'full_history']
#    strategy: str [Default: 'mixed']
components:
  comp-evaluate-champion:
    executorLabel: exec-evaluate-champion
    inputDefinitions:
      artifacts:
        reference_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        registry_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        test_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        evidently_api_url:
          parameterType: STRING
        evidently_project_name:
          parameterType: STRING
        evidently_secret:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        model_name:
          parameterType: STRING
        source_dir:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        evaluation_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-govern-champion:
    executorLabel: exec-govern-champion
    inputDefinitions:
      artifacts:
        evaluation_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        dry_run:
          parameterType: STRING
        min_gain:
          parameterType: NUMBER_DOUBLE
        mlflow_tracking_uri:
          parameterType: STRING
        model_name:
          parameterType: STRING
        source_dir:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        governance_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-importer:
    executorLabel: exec-importer
    inputDefinitions:
      parameters:
        uri:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        artifact:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-data:
    executorLabel: exec-prepare-data
    inputDefinitions:
      artifacts:
        raw_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        mlflow_tracking_uri:
          parameterType: STRING
        source_dir:
          parameterType: STRING
        split_strategy:
          parameterType: STRING
        strategy:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        test_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        validation_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-candidates:
    executorLabel: exec-register-candidates
    inputDefinitions:
      artifacts:
        train_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        training_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        validation_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        first_strategy:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        model_name:
          parameterType: STRING
        second_strategy:
          parameterType: STRING
        source_dir:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        registry_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        validation_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        mlflow_tracking_uri:
          parameterType: STRING
        source_dir:
          parameterType: STRING
        strategy:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        training_summary_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-champion:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_champion
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_champion(\n    source_dir: str,\n    model_name: str,\n\
          \    test_path: Input[Dataset],\n    reference_path: Input[Dataset],\n \
          \   registry_summary_path: Input[Dataset],\n    mlflow_tracking_uri: str,\n\
          \    evidently_api_url: str,\n    evidently_project_name: str,\n    evidently_secret:\
          \ str,\n    evaluation_summary_path: Output[Dataset],\n) -> None:\n    \"\
          \"\"Evaluate the promoted champion through predict_mlflow.py.\"\"\"\n\n\
          \    import json\n    import os\n    import subprocess\n    import sys\n\
          \    from pathlib import Path\n\n    def run_script(script_name: str, args:\
          \ list[str]) -> None:\n        script_path = Path(source_dir) / script_name\n\
          \        if not script_path.exists():\n            raise FileNotFoundError(f\"\
          Script not found: {script_path}\")\n        env = os.environ.copy()\n  \
          \      if mlflow_tracking_uri:\n            env[\"MLFLOW_TRACKING_URI\"\
          ] = mlflow_tracking_uri\n            if mlflow_tracking_uri.startswith(\"\
          https://\"):\n                env[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"\
          true\"\n        if evidently_api_url:\n            env[\"EVIDENTLY_API_URL\"\
          ] = evidently_api_url\n        if evidently_project_name:\n            env[\"\
          EVIDENTLY_PROJECT_NAME\"] = evidently_project_name\n        if evidently_secret:\n\
          \            env[\"EVIDENTLY_SECRET\"] = evidently_secret\n        subprocess.run([sys.executable,\
          \ str(script_path), *args], check=True, env=env)\n\n    model_uri = f\"\
          models:/{model_name}@champion\"\n    run_script(\n        script_name=\"\
          predict_mlflow.py\",\n        args=[\n            \"--model\",\n       \
          \     model_uri,\n            \"--data\",\n            test_path.path,\n\
          \            \"--reference-data\",\n            reference_path.path,\n \
          \           \"--evidently-api-url\",\n            evidently_api_url,\n \
          \           \"--evidently-project-name\",\n            evidently_project_name,\n\
          \            \"--evidently-secret\",\n            evidently_secret,\n  \
          \      ],\n    )\n\n    summary = {\n        \"model_uri\": model_uri,\n\
          \        \"test_path\": test_path.path,\n        \"reference_path\": reference_path.path,\n\
          \        \"registry_summary_path\": registry_summary_path.path,\n      \
          \  \"note\": \"Detailed metrics are logged in MLflow by predict_mlflow.py\"\
          ,\n    }\n    Path(evaluation_summary_path.path).write_text(\n        json.dumps(summary,\
          \ indent=2, ensure_ascii=False),\n        encoding=\"utf-8\",\n    )\n\n"
        image: jupyterlab-kfp:0.1.0
    exec-govern-champion:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - govern_champion
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef govern_champion(\n    source_dir: str,\n    model_name: str,\n\
          \    min_gain: float,\n    dry_run: str,\n    evaluation_summary_path: Input[Dataset],\n\
          \    mlflow_tracking_uri: str,\n    governance_summary_path: Output[Dataset],\n\
          ) -> None:\n    \"\"\"Run governance decision and persist a simple decision\
          \ artifact.\"\"\"\n\n    import json\n    import os\n    import subprocess\n\
          \    import sys\n    from pathlib import Path\n\n    def run_script(script_name:\
          \ str, args: list[str]) -> None:\n        script_path = Path(source_dir)\
          \ / script_name\n        if not script_path.exists():\n            raise\
          \ FileNotFoundError(f\"Script not found: {script_path}\")\n        env =\
          \ os.environ.copy()\n        if mlflow_tracking_uri:\n            env[\"\
          MLFLOW_TRACKING_URI\"] = mlflow_tracking_uri\n            if mlflow_tracking_uri.startswith(\"\
          https://\"):\n                env[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"\
          true\"\n        subprocess.run([sys.executable, str(script_path), *args],\
          \ check=True, env=env)\n\n    run_script(\n        script_name=\"govern.py\"\
          ,\n        args=[\n            \"--model-name\",\n            model_name,\n\
          \            \"--min-gain\",\n            str(min_gain),\n            \"\
          --dry-run\",\n            dry_run,\n        ],\n    )\n\n    summary = {\n\
          \        \"model_name\": model_name,\n        \"min_gain\": min_gain,\n\
          \        \"dry_run\": dry_run,\n        \"evaluation_summary_path\": evaluation_summary_path.path,\n\
          \        \"decision\": \"logged in MLflow registry tags by govern.py\",\n\
          \    }\n    Path(governance_summary_path.path).write_text(\n        json.dumps(summary,\
          \ indent=2, ensure_ascii=False),\n        encoding=\"utf-8\",\n    )\n\n"
        image: jupyterlab-kfp:0.1.0
    exec-importer:
      importer:
        artifactUri:
          runtimeParameter: uri
        typeSchema:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    exec-prepare-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data(\n    source_dir: str,\n    raw_dataset: Input[Dataset],\n\
          \    strategy: str,\n    split_strategy: str,\n    mlflow_tracking_uri:\
          \ str,\n    train_path: Output[Dataset],\n    validation_path: Output[Dataset],\n\
          \    test_path: Output[Dataset],\n) -> None:\n    \"\"\"Run prep.py and\
          \ expose the split parquet files as KFP artifacts.\"\"\"\n\n    import os\n\
          \    import shutil\n    import subprocess\n    import sys\n    import tempfile\n\
          \    from pathlib import Path\n\n    def run_script(script_name: str, args:\
          \ list[str]) -> None:\n        script_path = Path(source_dir) / script_name\n\
          \        if not script_path.exists():\n            raise FileNotFoundError(f\"\
          Script not found: {script_path}\")\n        env = os.environ.copy()\n  \
          \      if mlflow_tracking_uri:\n            env[\"MLFLOW_TRACKING_URI\"\
          ] = mlflow_tracking_uri\n            if mlflow_tracking_uri.startswith(\"\
          https://\"):\n                env[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"\
          true\"\n        subprocess.run([sys.executable, str(script_path), *args],\
          \ check=True, env=env)\n\n    with tempfile.TemporaryDirectory() as temp_dir:\n\
          \        run_script(\n            script_name=\"prep.py\",\n           \
          \ args=[\n                \"--input\",\n                raw_dataset.path,\n\
          \                \"--output\",\n                temp_dir,\n            \
          \    \"--strategy\",\n                strategy,\n                \"--split-strategy\"\
          ,\n                split_strategy,\n            ],\n        )\n\n      \
          \  produced = {\n            \"train.parquet\": train_path.path,\n     \
          \       \"validation.parquet\": validation_path.path,\n            \"test.parquet\"\
          : test_path.path,\n        }\n        for filename, destination in produced.items():\n\
          \            src = Path(temp_dir) / filename\n            if not src.exists():\n\
          \                raise FileNotFoundError(f\"Expected output missing: {src}\"\
          )\n            Path(destination).parent.mkdir(parents=True, exist_ok=True)\n\
          \            shutil.copyfile(src, destination)\n\n"
        image: jupyterlab-kfp:0.1.0
    exec-register-candidates:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_candidates
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_candidates(\n    source_dir: str,\n    train_path: Input[Dataset],\n\
          \    validation_path: Input[Dataset],\n    training_summary_path: Input[Dataset],\n\
          \    model_name: str,\n    first_strategy: str,\n    second_strategy: str,\n\
          \    mlflow_tracking_uri: str,\n    registry_summary_path: Output[Dataset],\n\
          ) -> None:\n    \"\"\"Register two candidate strategies and write a tiny\
          \ summary artifact.\"\"\"\n\n    import json\n    import os\n    import\
          \ subprocess\n    import sys\n    from pathlib import Path\n\n    def run_script(script_name:\
          \ str, args: list[str]) -> None:\n        script_path = Path(source_dir)\
          \ / script_name\n        if not script_path.exists():\n            raise\
          \ FileNotFoundError(f\"Script not found: {script_path}\")\n        env =\
          \ os.environ.copy()\n        if mlflow_tracking_uri:\n            env[\"\
          MLFLOW_TRACKING_URI\"] = mlflow_tracking_uri\n            if mlflow_tracking_uri.startswith(\"\
          https://\"):\n                env[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"\
          true\"\n        subprocess.run([sys.executable, str(script_path), *args],\
          \ check=True, env=env)\n\n    run_script(\n        script_name=\"register.py\"\
          ,\n        args=[\n            \"--train\",\n            train_path.path,\n\
          \            \"--validation\",\n            validation_path.path,\n    \
          \        \"--model-name\",\n            model_name,\n            \"--first-strategy\"\
          ,\n            first_strategy,\n            \"--second-strategy\",\n   \
          \         second_strategy,\n        ],\n    )\n\n    summary = {\n     \
          \   \"model_name\": model_name,\n        \"first_strategy\": first_strategy,\n\
          \        \"second_strategy\": second_strategy,\n        \"train_path\":\
          \ train_path.path,\n        \"validation_path\": validation_path.path,\n\
          \        \"training_summary_path\": training_summary_path.path,\n    }\n\
          \    Path(registry_summary_path.path).write_text(\n        json.dumps(summary,\
          \ indent=2, ensure_ascii=False),\n        encoding=\"utf-8\",\n    )\n\n"
        image: jupyterlab-kfp:0.1.0
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    source_dir: str,\n    train_path: Input[Dataset],\n\
          \    validation_path: Input[Dataset],\n    strategy: str,\n    mlflow_tracking_uri:\
          \ str,\n    training_summary_path: Output[Dataset],\n) -> None:\n    \"\"\
          \"Run train_mlflow.py as a dedicated training node in the DAG.\"\"\"\n\n\
          \    import json\n    import os\n    import subprocess\n    import sys\n\
          \    from pathlib import Path\n\n    def run_script(script_name: str, args:\
          \ list[str]) -> None:\n        script_path = Path(source_dir) / script_name\n\
          \        if not script_path.exists():\n            raise FileNotFoundError(f\"\
          Script not found: {script_path}\")\n        env = os.environ.copy()\n  \
          \      if mlflow_tracking_uri:\n            env[\"MLFLOW_TRACKING_URI\"\
          ] = mlflow_tracking_uri\n            if mlflow_tracking_uri.startswith(\"\
          https://\"):\n                env[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"\
          true\"\n        subprocess.run([sys.executable, str(script_path), *args],\
          \ check=True, env=env)\n\n    run_script(\n        script_name=\"train_mlflow.py\"\
          ,\n        args=[\n            \"--data\",\n            train_path.path,\n\
          \            \"--validation\",\n            validation_path.path,\n    \
          \    ],\n    )\n\n    summary = {\n        \"strategy\": strategy,\n   \
          \     \"train_path\": train_path.path,\n        \"validation_path\": validation_path.path,\n\
          \        \"note\": \"Detailed training metrics and model artifacts are logged\
          \ by train_mlflow.py\",\n    }\n    Path(training_summary_path.path).write_text(\n\
          \        json.dumps(summary, indent=2, ensure_ascii=False),\n        encoding=\"\
          utf-8\",\n    )\n\n"
        image: jupyterlab-kfp:0.1.0
pipelineInfo:
  description: Kubeflow-native orchestration for the current MLflow/DVC project.
  name: electricity-forecaster-kubeflow
root:
  dag:
    tasks:
      evaluate-champion:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-champion
        dependentTasks:
        - prepare-data
        - register-candidates
        inputs:
          artifacts:
            reference_path:
              taskOutputArtifact:
                outputArtifactKey: train_path
                producerTask: prepare-data
            registry_summary_path:
              taskOutputArtifact:
                outputArtifactKey: registry_summary_path
                producerTask: register-candidates
            test_path:
              taskOutputArtifact:
                outputArtifactKey: test_path
                producerTask: prepare-data
          parameters:
            evidently_api_url:
              componentInputParameter: evidently_api_url
            evidently_project_name:
              componentInputParameter: evidently_project_name
            evidently_secret:
              componentInputParameter: evidently_secret
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            model_name:
              componentInputParameter: model_name
            source_dir:
              componentInputParameter: source_dir
        taskInfo:
          name: evaluate-champion
      govern-champion:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-govern-champion
        dependentTasks:
        - evaluate-champion
        inputs:
          artifacts:
            evaluation_summary_path:
              taskOutputArtifact:
                outputArtifactKey: evaluation_summary_path
                producerTask: evaluate-champion
          parameters:
            dry_run:
              componentInputParameter: governance_dry_run
            min_gain:
              componentInputParameter: min_gain
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            model_name:
              componentInputParameter: model_name
            source_dir:
              componentInputParameter: source_dir
        taskInfo:
          name: govern-champion
      importer:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer
        inputs:
          parameters:
            uri:
              componentInputParameter: raw_dataset_uri
        taskInfo:
          name: importer
      prepare-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data
        dependentTasks:
        - importer
        inputs:
          artifacts:
            raw_dataset:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
          parameters:
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            source_dir:
              componentInputParameter: source_dir
            split_strategy:
              componentInputParameter: split_strategy
            strategy:
              componentInputParameter: strategy
        taskInfo:
          name: prepare-data
      register-candidates:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-candidates
        dependentTasks:
        - prepare-data
        - train-model
        inputs:
          artifacts:
            train_path:
              taskOutputArtifact:
                outputArtifactKey: train_path
                producerTask: prepare-data
            training_summary_path:
              taskOutputArtifact:
                outputArtifactKey: training_summary_path
                producerTask: train-model
